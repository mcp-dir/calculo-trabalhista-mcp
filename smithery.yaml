# Smithery configuration for Cálculo Trabalhista
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_calculo-trabalhista

name: calculo-trabalhista-mcp
displayName: "Cálculo Trabalhista"
description: >
  **Cálculo trabalhista** para IA. Atualize verbas e condenações da Justiça do Trabalho com correção oficial, juros e o salário mínimo do período. Índices e salário mínimo ao vivo, sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/calculo-trabalhista-mcp
repository: https://github.com/mcp-dir/calculo-trabalhista-mcp

tags:
  - juridico
  - legal
  - trabalhista
  - salario-minimo
  - correcao-monetaria
  - brazil
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_calculo-trabalhista

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_calculo-trabalhista/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
